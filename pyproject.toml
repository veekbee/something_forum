[project]
name = "something-forum"
version = "0.1.0"
license = "MIT"
description = "A paid, invite-only discussion forum. See docs/DESIGN.md."
requires-python = ">=3.12"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "--reuse-db"
