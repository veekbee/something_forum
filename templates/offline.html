{% load static %}<!doctype html>
<html lang="en"{% if user.is_authenticated and user.colour_scheme != "device" %} data-theme="{{ user.colour_scheme }}"{% endif %}>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Offline</title>
  <link rel="stylesheet" href="{% static 'css/forum.css' %}">
</head>
<body>
  <header class="masthead"><div class="inner"><span class="brand">{{ site_name }}</span></div></header>
  <main>
    <p class="body"><strong>You're offline.</strong> {{ site_name }} needs a connection to show posts and messages. Check your connection and try again.</p>
    <form method="get"><button>Try again</button></form>
  </main>
</body>
</html>
