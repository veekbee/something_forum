{% if page.has_other_pages %}
<nav class="pagination" aria-label="Pages">
  {% if page.has_previous %}<a href="?{% if query %}q={{ query|urlencode }}&amp;{% endif %}{% if pagination_query %}{{ pagination_query }}&amp;{% endif %}page={{ page.previous_page_number }}">← Previous</a>{% endif %}
  <span class="muted">Page {{ page.number }} of {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a href="?{% if query %}q={{ query|urlencode }}&amp;{% endif %}{% if pagination_query %}{{ pagination_query }}&amp;{% endif %}page={{ page.next_page_number }}">Next →</a>{% endif %}
</nav>
{% endif %}
